name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Validate Docker Compose and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare example environment files
        shell: bash
        run: |
          set -euo pipefail
          for template in env/*.env.example; do
            cp "$template" "${template%.example}"
          done

      - name: Validate Docker Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose-spring.yml config -q
          docker compose -f docker-compose-spring.yml --profile cloudflare config -q
          docker compose -f docker-compose-go.yml config -q
          docker compose -f docker-compose-go.yml --profile cloudflare config -q

      - name: Validate shell scripts and JSON fixtures
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            bash -n "$script"
          done
          ruby -rjson -e 'Dir.glob("test_results/*.json").sort.each { |f| JSON.parse(File.read(f)) }'
